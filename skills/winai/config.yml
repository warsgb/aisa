# AISA 系统 API 地址
AISA_API_URL: "http://localhost:3001"

# API 认证 Token（暂未启用，可留空）
AISA_API_TOKEN: "a747d110ae8a990afbe8d09c2332023e6838b5f095a06efb33237f873ebbd71a"

# 默认团队 ID（可选）
# 留空：每次手动指定团队ID
